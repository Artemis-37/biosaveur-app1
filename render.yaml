# Déploiement Render (Blueprint) : Dashboard Render > New > Blueprint > choisir ce dépôt.
# La base PostgreSQL est externe (Neon, gratuite et sans limite de durée) :
# Render n'autorise qu'une seule base gratuite par compte, déjà utilisée par l'ancienne application.

services:
  - type: web
    name: biosaveur-molomolo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Adresse de connexion Neon (postgresql://…neon.tech/…?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Compte administrateur créé au premier démarrage
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Position de l'entrepôt (point de départ des tournées)
      - key: DEPOT_LAT
        value: "5.3478"
      - key: DEPOT_LNG
        value: "-4.0236"
      # CinetPay : à remplir quand les identifiants sont disponibles
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
      - key: CINETPAY_SECRET_KEY
        sync: false
