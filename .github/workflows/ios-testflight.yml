# Compile, signe et envoie l'appli iPhone sur App Store Connect (TestFlight), sans Mac.
# À lancer depuis l'onglet Actions > « Appli iOS — TestFlight » > Run workflow.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   APPLE_TEAM_ID         identifiant d'équipe Apple Developer (10 caractères)
#   ASC_KEY_ID            identifiant de la clé API App Store Connect
#   ASC_ISSUER_ID         identifiant de l'émetteur (Issuer ID)
#   ASC_KEY_P8_BASE64     contenu du fichier AuthKey_XXXX.p8 encodé en base64
name: Appli iOS — TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-14
    env:
      APP_API_URL: ${{ vars.APP_API_URL || 'https://biosaveur-molomolo-gvbm.onrender.com' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Vérifier les secrets Apple
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret manquant : $v (voir README, section iOS)"; exit 1; fi
          done
      - run: npm ci
      - run: node scripts/prepare-app.js && npx cap sync ios

      - name: Clé API App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"

      - name: Archive signée
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Envoi sur App Store Connect (TestFlight)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
